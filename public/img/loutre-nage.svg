<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 24 260 96" width="520" height="192" role="img" aria-label="Une loutre nage sur le dos en cassant un coquillage">
  <defs>
    <clipPath id="swim-clip"><rect width="260" height="130" rx="30" /></clipPath>
    <clipPath id="swim-above"><rect x="-20" y="-20" width="300" height="108" /></clipPath>
    <linearGradient id="swim-fx" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0" /><stop offset="0.2" stop-color="#fff" /><stop offset="0.8" stop-color="#fff" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></linearGradient>
    <linearGradient id="swim-fy" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="88" y2="116"><stop offset="0" stop-color="#fff" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></linearGradient>
    <mask id="swim-mx" maskUnits="userSpaceOnUse" x="0" y="0" width="260" height="130"><rect width="260" height="130" fill="url(#swim-fx)" /></mask>
    <mask id="swim-my" maskUnits="userSpaceOnUse" x="-300" y="0" width="900" height="130"><rect x="-300" width="900" height="130" fill="url(#swim-fy)" /></mask>
  </defs>

  <g>
    <g class="water back" mask="url(#swim-mx)"><g mask="url(#swim-my)"><path d="M-260 79 q32.5 -7 65 0 t65 0 t65 0 t65 0 t65 0 t65 0 t65 0 t65 0 V140 H-260 Z" /></g></g>

    <g clip-path="url(#swim-above)"><g class="otter">
      <!-- queue et pattes arrière -->
      <g class="tail"><path class="b line" d="M194 70 C210 65 228 69 240 57 C246 52 251 55 248 62 C238 82 214 88 194 84 Z" /></g>
      <g class="foot f1"><path class="b line" d="M168 76 C163 62 168 50 177 51 C186 52 186 64 182 77 Z" /><path class="toes" d="M172 57 v7 M177 55 v9 M182 58 v7" /></g>
      <g class="foot f2"><path class="b line" d="M184 78 C181 66 186 56 193 58 C200 60 198 70 194 80 Z" /></g>
      <!-- corps -->
      <path class="b" d="M78 70 C84 54 120 50 150 52 C184 54 202 64 200 78 C198 94 160 100 120 98 C96 96 76 90 78 70 Z" />
      <path class="b" d="M66 64 C70 48 96 46 106 56 C98 74 84 84 66 80 Z" />
      <!-- tête de profil, renversée sur le dos : le museau pointe vers le ciel, la nuque est dans l'eau -->
      <g class="head">
        <g transform="translate(66 56) rotate(14) scale(1 -1)">
          <circle class="b" cx="0" cy="0" r="20.5" />
          <ellipse class="b" cx="9" cy="-15" rx="7" ry="6.2" /><ellipse class="ear-in" cx="9.6" cy="-15" rx="3.2" ry="2.6" />
          <ellipse class="muzzle" cx="-11" cy="3" rx="17" ry="12.5" />
          <ellipse class="nose" cx="-26" cy="1.6" rx="4.4" ry="3.4" />
          <path class="mouth" d="M-24 8 q6 4.4 12 1.2" />
          <g class="pads"><circle cx="-19" cy="6.6" r="1" /><circle cx="-15.5" cy="9.4" r="1" /><circle cx="-20.5" cy="10.4" r="1" /></g>
          <g class="eyes"><circle class="eye" cx="-6" cy="-1.6" r="3" /><circle class="hi" cx="-5" cy="-2.7" r="1" /></g>
        </g>
      </g>
      <!-- coquillage et pattes avant -->
      <g class="shell"><path class="b line" d="M104.5 62.0 A4.6 4.6 0 0 1 106.3 55.2 A4.6 4.6 0 0 1 111.2 50.3 A4.6 4.6 0 0 1 118.0 48.5 A4.6 4.6 0 0 1 124.8 50.3 A4.6 4.6 0 0 1 129.7 55.2 A4.6 4.6 0 0 1 131.5 62.0 Z" /><path class="b line" d="M113.5 62 h9 v3 h-9 Z" /><path class="rid" d="M118 61 L108.9 55.8 M118 61 L112.8 51.9 M118 61 L118.0 50.5 M118 61 L123.2 51.9 M118 61 L127.1 55.8" /></g>
      <g class="paw p1"><ellipse class="pawfill" cx="104" cy="64" rx="9" ry="6.6" /><path class="toes" d="M99 61 v3.5 M104 60 v4.5 M109 61 v3.5" /></g>
      <g class="paw p2"><ellipse class="pawfill" cx="132" cy="65" rx="9" ry="6.6" /><path class="toes" d="M127 62 v3.5 M132 61 v4.5 M137 62 v3.5" /></g>
    </g>

    </g>

    <g class="water front" mask="url(#swim-mx)"><g mask="url(#swim-my)"><path d="M-260 83 q32.5 -8 65 0 t65 0 t65 0 t65 0 t65 0 t65 0 t65 0 t65 0 V140 H-260 Z" /></g></g>
    <g class="water foamline" mask="url(#swim-mx)"><path class="foam" d="M-260 83 q32.5 -8 65 0 t65 0 t65 0 t65 0 t65 0 t65 0 t65 0 t65 0" /></g>
    <g class="drops"><circle class="d1" cx="118" cy="34" r="2.6" /><circle class="d2" cx="106" cy="38" r="2" /><circle class="d3" cx="130" cy="33" r="1.8" /></g>
  </g>
<style>
  svg { overflow: hidden; }
  :root {
    --o-body: #2f7f72; --o-bg: #f3eee8; --o-feat: var(--o-bg);
    --o-muzzle: color-mix(in srgb, var(--o-body) 20%, var(--o-bg));
    --o-nose: var(--o-body); --o-eye: var(--o-body); --o-hi: var(--o-bg); --o-whisk: var(--o-body);
    --o-water: color-mix(in srgb, var(--o-body) 22%, var(--o-bg));
    --o-water-back: color-mix(in srgb, var(--o-body) 12%, var(--o-bg));
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --o-body: #5fb8a8; --o-bg: #17120f; --o-feat: var(--o-bg);
      --o-muzzle: color-mix(in srgb, var(--o-body) 62%, var(--o-bg));
      --o-nose: color-mix(in srgb, var(--o-body) 38%, var(--o-bg)); --o-eye: var(--o-bg); --o-hi: var(--o-body);
    }
    .paw .toes { stroke: var(--o-bg); }
  }
  .muzzle { fill: var(--o-muzzle); }
  .pawfill { fill: var(--o-muzzle); }
  .paw .toes { stroke: var(--o-body); opacity: 0.7; }
  .ear-in { fill: var(--o-muzzle); }
  .nose { fill: var(--o-nose); }
  .mouth { fill: none; stroke: var(--o-nose); stroke-linecap: round; stroke-width: 1.8; }
  .eye { fill: var(--o-eye); }
  .hi { fill: var(--o-hi); }
  .pads circle { fill: var(--o-nose); opacity: 0.75; }
  .b { fill: var(--o-body); }
  .line { stroke: var(--o-feat); stroke-width: 1.4; stroke-linejoin: round; }
  .toes { fill: none; stroke: var(--o-feat); stroke-width: 1.3; stroke-linecap: round; opacity: 0.85; }
  .rid { fill: none; stroke: var(--o-feat); stroke-width: 1.5; stroke-linecap: round; opacity: 0.8; }
  .water.front path { fill: var(--o-water); }
  .water.back path { fill: var(--o-water-back); }
  .foam { fill: none; stroke: var(--o-body); stroke-width: 2.2; stroke-linecap: round; opacity: 0.75; }
  .drops { display: none; }
/* La loutre suit la houle ; les vagues défilent d'un côté. */
  .otter {
    transform-box: view-box;
    transform-origin: 120px 80px;
    animation: bob 3.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(1px) rotate(-2.2deg); }
    50% { transform: translateY(-5px) rotate(2.2deg); }
  }
  .water path { animation: drift 4s linear infinite; }
  .water.back path { animation-duration: 7s; animation-direction: reverse; }
  @keyframes drift {
    to { transform: translateX(130px); }
  }
  .tail { transform-box: view-box; transform-origin: 196px 76px; animation: swish 2.4s ease-in-out infinite; }
  @keyframes swish {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(7deg); }
  }
  .foot { transform-box: view-box; transform-origin: 176px 76px; animation: wiggle 2.8s ease-in-out infinite; }
  .foot.f2 { transform-origin: 190px 78px; animation-delay: -1.1s; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(8deg); }
  }
  /* La patte droite lève, frappe le coquillage, rebondit ; le coquillage tressaute au choc. */
  .paw.p2 { transform-box: view-box; transform-origin: 138px 66px; animation: strike 1.4s ease-in infinite; }
  @keyframes strike {
    0%, 50% { transform: translate(10px, -22px) rotate(-42deg); }
    64% { transform: translate(-6px, 1px) rotate(8deg); }
    76%, 100% { transform: translate(10px, -22px) rotate(-42deg); }
  }
  .shell { transform-box: view-box; transform-origin: 118px 58px; animation: crack 1.4s ease-out infinite; }
  @keyframes crack {
    0%, 62% { transform: translateY(0) rotate(0); }
    66% { transform: translateY(2.5px) rotate(-6deg); }
    76% { transform: translateY(-2px) rotate(4deg); }
    90%, 100% { transform: translateY(0) rotate(0); }
  }
  .paw.p1 { animation: hold 1.4s ease-in-out infinite; }
  @keyframes hold {
    0%, 100% { transform: translateY(0); }
    70% { transform: translateY(1px); }
  }
  /* petit hochement de tête, à contretemps de la houle */
  .head { transform-box: view-box; transform-origin: 74px 74px; animation: nod 3.2s ease-in-out infinite; }
  @keyframes nod {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }
  /* clignement des yeux */
  .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  @keyframes blink {
    0%, 94%, 100% { transform: scaleY(1); }
    97% { transform: scaleY(0.1); }
  }
  .drops circle { animation: splash 1.4s ease-out infinite; }
  .drops .d2 { animation-delay: 0.08s; }
  .drops .d3 { animation-delay: 0.16s; }
  @keyframes splash {
    0%, 62% { opacity: 0; transform: translateY(8px); }
    70% { opacity: 0.9; }
    100% { opacity: 0; transform: translateY(-8px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .otter, .water path, .tail, .foot, .paw, .shell, .head, .eyes, .drops circle { animation: none; }
  }
</style></svg>