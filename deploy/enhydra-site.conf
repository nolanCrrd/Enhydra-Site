# Site de présentation d'Enhydra : fichiers statiques servis par Apache (aucun proxy, aucun programme).
# Installé par deploy/install.sh ; le certificat vient de Let's Encrypt.
<VirtualHost *:80>
    ServerName enhydra.nolancrrd.fr
    DocumentRoot /opt/enhydra-site/public

    # Le défi Let's Encrypt passe en clair ; tout le reste part en HTTPS
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    <Directory /opt/enhydra-site/public>
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/enhydra_site_error.log
    CustomLog ${APACHE_LOG_DIR}/enhydra_site_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName enhydra.nolancrrd.fr
    DocumentRoot /opt/enhydra-site/public

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/enhydra.nolancrrd.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/enhydra.nolancrrd.fr/privkey.pem

    <Directory /opt/enhydra-site/public>
        Require all granted
        # MultiViews : /confidentialite ouvre confidentialite.html
        Options -Indexes +MultiViews
        AllowOverride None
    </Directory>
    ErrorDocument 404 /404.html

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"

    # Images et polices ne changent presque jamais ; les pages se revalident à chaque visite
    ExpiresActive on
    ExpiresByType image/webp "access plus 30 days"
    ExpiresByType image/png "access plus 30 days"
    ExpiresByType font/woff2 "access plus 365 days"
    ExpiresByType text/css "access plus 1 day"

    ErrorLog ${APACHE_LOG_DIR}/enhydra_site_error.log
    CustomLog ${APACHE_LOG_DIR}/enhydra_site_access.log combined
</VirtualHost>
